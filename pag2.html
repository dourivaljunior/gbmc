<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Portal Garage Band - Player</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="main-stage">
        <div class="nav-buttons">
            <button class="btn-nav" onclick="window.history.back()">VOLTAR</button>
            <button class="btn-nav" onclick="location.href='index.html'">INÍCIO</button>
        </div>

        <div class="fire-box" style="width: 90%; max-width: 900px; background: #000;">
            <div class="content-inner" style="padding: 20px;">
                <h2 id="nome-artista" style="color: var(--neon-blue);"></h2>
                <iframe id="pdf-viewer" style="width:100%; height:400px; border:none;"></iframe>
                <div style="margin-top:20px;">
                    <p>MÚSICA ORIGINAL</p>
                    <audio id="audio-orig" controls style="width:100%; filter:invert(1);"></audio>
                    <p>BACKTRACKING</p>
                    <audio id="audio-bt" controls style="width:100%; filter:invert(1);"></audio>
                </div>
            </div>
        </div>
    </main>
    <script src="script.js"></script>
    <script>
        window.onload = () => app.carregarPlayerPag2();
    </script>
</body>
</html>
