<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portal Garage Band - Mário Cravo</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <aside class="sidebar">
        <h2 class="menu-label">ESTILO MUSICAL</h2>
        <nav id="nav-content" class="nav-list"></nav>
    </aside>

    <main class="main-stage">
        <!-- Barra de Navegação Superior -->
        <div class="nav-controls">
            <button id="btn-voltar" class="btn-neon-blue" onclick="app.voltar()">⬅ VOLTAR</button>
            <button id="btn-inicio" class="btn-neon-blue" onclick="app.irParaInicio()">🏠 INÍCIO</button>
        </div>
        
        <!-- Tela de Boas-Vindas -->
        <div id="welcome-screen">
            <div class="neon-title-small">PORTAL GARAGE BAND MÁRIO CRAVO</div>
            <div class="image-box">
                <img src="https://lh3.googleusercontent.com/d/1gn2p3EF0fnJo5YC1KqAmHc5ELclpZvzF" alt="Garage Band">
            </div>
        </div>

        <!-- Player -->
        <div id="player" class="player-glass">
            <h2 id="musica-titulo" class="neon-text-blue">Nome da Música</h2>
            <div class="player-body">
                <section class="pdf-section">
                    <p class="label">📄 LETRA (PDF)</p>
                    <iframe id="pdf-viewer" src=""></iframe>
                </section>
                
                <section class="audio-section">
                    <p class="label">🎵 MIXAGEM & PLAYBACK</p>
                    <div class="audio-grid">
                        <div class="audio-card">
                            <span>Original</span>
                            <audio id="audio-main" controls></audio>
                        </div>
                        <div class="audio-card">
                            <span>Backtracking</span>
                            <audio id="audio-bt" controls></audio>
                        </div>
                    </div>
                </section>
            </div>
        </div>
    </main>

    <script src="script.js"></script>
</body>
</html>
