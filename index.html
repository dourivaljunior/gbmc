<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portal Garage Band - Mário Cravo</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <aside class="sidebar">
        <h2 class="menu-label">MENU</h2>
        <nav id="nav-content" class="nav-list"></nav>
    </aside>

    <main class="main-stage">
        <button id="btn-voltar" class="btn-neon-pink" onclick="app.voltar()">⬅ VOLTAR</button>
        
        <div id="welcome-screen">
            <div class="neon-title">PORTAL GARAGE BAND<br>MÁRIO CRAVO</div>
            <!-- A imagem ChatGPT Image 2 de mai. de 2026, 09_26_10.jpg é o background do Main Stage no CSS -->
        </div>

        <div id="player" class="player-glass">
            <h2 id="musica-titulo" class="neon-text-blue">Nome da Música</h2>
            <div class="player-body">
                <section class="pdf-section">
                    <p class="label">📄 LETRA (PDF)</p>
                    <iframe id="pdf-viewer" src=""></iframe>
                </section>
                
                <section class="audio-section">
                    <p class="label">🎵 MIXAGEM & PLAYBACK</p>
                    <div class="audio-grid">
                        <div class="audio-card">
                            <span>Original</span>
                            <audio id="audio-main" controls></audio>
                        </div>
                        <div class="audio-card">
                            <span>Backtracking</span>
                            <audio id="audio-bt" controls></audio>
                        </div>
                    </div>
                </section>
            </div>
        </div>
    </main>

    <script src="script.js"></script>
</body>
</html>
