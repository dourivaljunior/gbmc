<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MusicManager Pro | Sistema de Acervo</title>
    <style>
        :root {
            --bg-dark: #0f172a;
            --sidebar-bg: #1e293b;
            --accent-blue: #3b82f6;
            --text-main: #f8fafc;
            --card-hover: #334155;
        }

        * { box-sizing: border-box; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: var(--bg-dark); color: var(--text-main); margin: 0; overflow: hidden; }

        /* Estrutura Principal */
        .layout { display: flex; height: 100vh; width: 100vw; }

        /* Sidebar Esquerda */
        .sidebar { width: 320px; background: var(--sidebar-bg); border-right: 1px solid #334155; display: flex; flex-direction: column; padding: 20px; }
        .sidebar h2 { color: var(--accent-blue); font-size: 1.2rem; border-bottom: 2px solid #334155; padding-bottom: 10px; margin-top: 0; }
        .nav-list { list-style: none; padding: 0; flex-grow: 1; overflow-y: auto; }
        .nav-item { padding: 15px; background: #0f172a; margin-bottom: 8px; border-radius: 8px; cursor: pointer; transition: 0.3s; border-left: 4px solid transparent; }
        .nav-item:hover { background: var(--card-hover); border-left-color: var(--accent-blue); }
        .nav-item.active { background: var(--accent-blue); color: white; }

        /* Área de Conteúdo Direita */
        .main-content { flex-grow: 1; padding: 30px; overflow-y: auto; display: flex; flex-direction: column; }
        .header-content { display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; }
        .btn-voltar { background: #475569; color: white; border: none; padding: 10px 20px; border-radius: 6px; cursor: pointer; display: none; }
        .btn-voltar:hover { background: #64748b; }

        /* Grid de Músicas e Bandas */
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 20px; }
        .card { background: var(--sidebar-bg); padding: 20px; border-radius: 12px; border: 1px solid #334155; transition: 0.3s; position: relative; }
        .card:hover { transform: translateY(-5px); border-color: var(--accent-blue); }
        .card h3 { margin: 0 0 15px 0; font-size: 1.1rem; color: var(--accent-blue); }

        /* Botões de Arquivos */
        .file-links { display: flex; flex-direction: column; gap: 8px; }
        .btn-file { text-decoration: none; padding: 10px; border-radius: 6px; font-size: 0.85rem; text-align: center; font-weight: bold; transition: 0.2s; }
        .btn-pdf { background: #ef4444; color: white; }
        .btn-mp3 { background: #10b981; color: white; }
        .btn-bt { background: #f59e0b; color: white; }
        .btn-file:hover { opacity: 0.8; filter: brightness(1.2); }

        /* Loader */
        #loader { text-align: center; margin-top: 50px; color: var(--accent-blue); font-weight: bold; }
    </style>
</head>
<body>

<div class="layout">
    <aside class="sidebar">
        <h2 id="menu-title">Estilos Musicais</h2>
        <ul id="nav-list" class="nav-list">
            <!-- Gerado via JS -->
        </ul>
        <button id="btn-voltar" class="btn-voltar" onclick="app.voltar()">⬅ VOLTAR</button>
    </aside>

    <main class="main-content">
        <div class="header-content">
            <h1 id="view-title">Início</h1>
            <div id="status">Conectado ao Drive</div>
        </div>

        <div id="loader">Carregando Acervo...</div>
        <div id="main-grid" class="grid">
            <!-- Cards de Bandas/Músicas -->
        </div>
    </main>
</div>

<script>
    /**
     * MUSICMANAGER SENIOR ENGINE
     */
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbywSHZf36zGAywDEnCq6Y7tkt7aqUNdnP0ltHBAOH4sjtDFRHjQzoj0RhbsK4GJVJhNzw/exec";

    const app = {
        dados: null,
        nivel: 'estilos', // estilos | bandas | musicas
        estiloAtual: null,
        bandaAtual: null,

        async init() {
            try {
                const res = await fetch(SCRIPT_URL);
                this.dados = await res.json();
                document.getElementById('loader').style.display = 'none';
                this.renderEstilos();
            } catch (e) {
                document.getElementById('loader').innerText = "Erro ao carregar dados do Google Drive.";
            }
        },

        renderEstilos() {
            this.nivel = 'estilos';
            this.toggleBotao(false);
            document.getElementById('view-title').innerText = "Selecione um Estilo";
            const nav = document.getElementById('nav-list');
            const grid = document.getElementById('main-grid');
            
            nav.innerHTML = '';
            grid.innerHTML = '';

            Object.keys(this.dados).forEach(estilo => {
                const li = document.createElement('li');
                li.className = 'nav-item';
                li.innerText = estilo;
                li.onclick = () => this.carregarBandas(estilo);
                nav.appendChild(li);

                // Criar card visual também
                const card = document.createElement('div');
                card.className = 'card';
                card.innerHTML = `<h3>${estilo}</h3><p>Ver bandas disponíveis</p>`;
                card.onclick = () => this.carregarBandas(estilo);
                grid.appendChild(card);
            });
        },

        carregarBandas(estilo) {
            this.nivel = 'bandas';
            this.estiloAtual = estilo;
            this.toggleBotao(true);
            document.getElementById('view-title').innerText = estilo;
            
            const grid = document.getElementById('main-grid');
            grid.innerHTML = '';

            const bandas = Object.keys(this.dados[estilo]);
            if (bandas.length === 0) {
                grid.innerHTML = "<p>Nenhuma banda cadastrada neste estilo.</p>";
                return;
            }

            bandas.forEach(banda => {
                const card = document.createElement('div');
                card.className = 'card';
                card.innerHTML = `<h3>${banda}</h3><p>Lista de Músicas e Backtracks</p>`;
                card.onclick = () => this.carregarMusicas(banda);
                grid.appendChild(card);
            });
        },

        carregarMusicas(banda) {
            this.nivel = 'musicas';
            this.bandaAtual = banda;
            document.getElementById('view-title').innerText = banda;
            
            const grid = document.getElementById('main-grid');
            grid.innerHTML = '';

            const musicas = this.dados[this.estiloAtual][banda];

            musicas.forEach(m => {
                const card = document.createElement('div');
                card.className = 'card';
                // Link direto do Google Drive para visualização/download
                const driveBase = "https://drive.google.com/uc?id=";
                
                card.innerHTML = `
                    <h3>${m.titulo}</h3>
                    <div class="file-links">
                        <a href="${driveBase}${m.letra}" target="_blank" class="btn-file btn-pdf">📄 LETRA (PDF)</a>
                        <a href="${driveBase}${m.musica}" target="_blank" class="btn-file btn-mp3">🎵 MÚSICA (MP3)</a>
                        <a href="${driveBase}${m.bt}" target="_blank" class="btn-file btn-bt">🎸 BACK TRACKING (MP3)</a>
                    </div>
                `;
                grid.appendChild(card);
            });
        },

        voltar() {
            if (this.nivel === 'musicas') this.carregarBandas(this.estiloAtual);
            else if (this.nivel === 'bandas') this.renderEstilos();
        },

        toggleBotao(show) {
            document.getElementById('btn-voltar').style.display = show ? 'block' : 'none';
        }
    };

    app.init();
</script>
</body>
</html>
