<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Portal Garage Band - Mário Cravo</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <aside class="sidebar">
        <h2 class="menu-label">ESTILO MUSICAL</h2>
        <nav id="nav-content"></nav>
    </aside>

    <main class="main-stage">
        <div class="nav-controls">
            <button class="btn-neon-blue" onclick="app.voltar()">⬅ VOLTAR</button>
            <button class="btn-neon-blue" onclick="app.irParaInicio()">🏠 INÍCIO</button>
        </div>
        
        <div id="welcome-screen">
            <div class="neon-title-small">PORTAL GARAGE BAND MÁRIO CRAVO</div>
            <div class="image-box">
                <img src="https://lh3.googleusercontent.com/d/1gn2p3EF0fnJo5YC1KqAmHc5ELcl1" alt="Garage Band">
            </div>
        </div>

        <div id="player" class="player-glass" style="display: none;">
            <h2 id="musica-titulo" class="neon-text-blue">NOME DA MÚSICA</h2>
            
            <div class="horizontal-control-panel">
                <div class="control-cell">
                    <p class="cell-label">CONTEÚDO</p>
                    <a id="link-cifra" href="#" target="_blank" class="btn-action-neon">📄 EXIBIR LETRA</a>
                </div>

                <div class="control-cell">
                    <p class="cell-label">MÚSICA ORIGINAL</p>
                    <div class="audio-controls">
                        <button id="play-main" onclick="app.tocar('main')" class="btn-play">▶ PLAY</button>
                        <button onclick="app.parar('main')" class="btn-stop">■ STOP</button>
                    </div>
                </div>

                <div class="control-cell">
                    <p class="cell-label">BACK TRACKING</p>
                    <div class="audio-controls">
                        <button id="play-bt" onclick="app.tocar('bt')" class="btn-play">▶ PLAY</button>
                        <button onclick="app.parar('bt')" class="btn-stop">■ STOP</button>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <!-- Tags de áudio essenciais -->
    <audio id="audio-main-el" preload="auto"></audio>
    <audio id="audio-bt-el" preload="auto"></audio>

    <script src="script.js"></script>
</body>
</html>
