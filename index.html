<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portal Garage Band - Mário Cravo</title>
    <style>
        :root {
            --neon-blue: #00f2ff;
            --neon-pink: #ff00e6;
            --glass: rgba(255, 255, 255, 0.05);
            --bg: #05070a;
        }

        body {
            background-color: var(--bg);
            color: white;
            font-family: 'Segoe UI', Roboto, sans-serif;
            margin: 0;
            display: flex;
            height: 100vh;
            overflow: hidden;
        }

        /* LETREIRO LUMINOSO NEON */
        .neon-title {
            font-family: 'Courier New', monospace;
            font-size: 2.5rem;
            color: #fff;
            text-shadow: 0 0 5px #fff, 0 0 10px #fff, 0 0 20px var(--neon-blue), 0 0 30px var(--neon-blue), 0 0 40px var(--neon-blue);
            animation: flicker 2s infinite alternate;
            text-align: center;
            margin: 20px 0;
        }

        @keyframes flicker {
            0%, 18%, 22%, 25%, 53%, 57%, 100% { opacity: 1; }
            20%, 24%, 55% { opacity: 0.3; text-shadow: none; }
        }

        /* LAYOUT */
        .sidebar {
            width: 300px;
            background: rgba(15, 23, 42, 0.9);
            backdrop-filter: blur(10px);
            border-right: 2px solid var(--neon-blue);
            padding: 20px;
            display: flex;
            flex-direction: column;
            z-index: 10;
        }

        .main-stage {
            flex: 1;
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
            background-image: linear-gradient(rgba(0,0,0,0.7), rgba(0,0,0,0.7)), url('https://lh3.googleusercontent.com/d/1wE8PTP74rEIkOPIXVqHxy2bCuuRQRaa5'); /* ID da sua pasta para imagem de fundo */
            background-size: cover;
            background-position: center;
        }

        /* LISTAS E BOTÕES */
        .nav-item {
            padding: 15px;
            margin: 10px 0;
            background: var(--glass);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 10px;
            cursor: pointer;
            transition: 0.3s;
            text-transform: uppercase;
            letter-spacing: 2px;
            font-weight: bold;
        }

        .nav-item:hover {
            background: var(--neon-blue);
            color: black;
            box-shadow: 0 0 20px var(--neon-blue);
        }

        /* PLAYER INTERNO (MODERN JAVASCRIPT) */
        .player-container {
            width: 90%;
            max-width: 800px;
            background: rgba(0, 0, 0, 0.85);
            border-radius: 20px;
            border: 1px solid var(--neon-pink);
            padding: 25px;
            display: none; /* Inicia oculto */
            backdrop-filter: blur(15px);
            box-shadow: 0 0 30px var(--neon-pink);
            margin-top: 20px;
        }

        iframe {
            width: 100%;
            height: 400px;
            border-radius: 10px;
            border: none;
            margin-bottom: 15px;
        }

        audio {
            width: 100%;
            margin: 10px 0;
            filter: invert(100%) hue-rotate(180deg) brightness(1.5);
        }

        .controls-row {
            display: flex;
            justify-content: space-around;
            margin-top: 15px;
        }

        .btn-action {
            background: none;
            border: 1px solid white;
            color: white;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
        }

        .btn-action:hover { background: white; color: black; }

        .btn-voltar {
            position: absolute;
            top: 20px;
            left: 320px;
            background: var(--neon-pink);
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            font-weight: bold;
            cursor: pointer;
            display: none;
        }

    </style>
</head>
<body>

    <aside class="sidebar">
        <h2 style="color: var(--neon-blue); text-align: center;">MENU</h2>
        <div id="nav-content">
            <!-- Dinâmico -->
        </div>
    </aside>

    <main class="main-stage" id="stage">
        <button id="btn-voltar" class="btn-voltar" onclick="app.voltar()">⬅ VOLTAR</button>
        
        <div id="welcome-screen">
            <div class="neon-title">PORTAL GARAGE BAND<br>MÁRIO CRAVO</div>
            <!-- A imagem de fundo do "stage" já é a da garagem -->
        </div>

        <div id="player" class="player-container">
            <h2 id="musica-titulo" style="color: var(--neon-blue); margin-top: 0;">Nome da Música</h2>
            
            <p>📄 LETRA (PDF)</p>
            <iframe id="pdf-viewer" src=""></iframe>
            
            <p>🎵 MÚSICA & BACKTRACKING</p>
            <div class="controls-row">
                <div style="flex: 1; margin-right: 10px;">
                    <small>Original</small>
                    <audio id="audio-main" controls></audio>
                </div>
                <div style="flex: 1;">
                    <small>Backtracking</small>
                    <audio id="audio-bt" controls></audio>
                </div>
            </div>
        </div>
    </main>

<script>
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbywSHZf36zGAywDEnCq6Y7tkt7aqUNdnP0ltHBAOH4sjtDFRHjQzoj0RhbsK4GJVJhNzw/exec";
    const DRIVE_BASE = "https://lh3.googleusercontent.com/d/";

    const app = {
        dados: null,
        nivel: 'estilos',

        async init() {
            const res = await fetch(SCRIPT_URL);
            this.dados = await res.json();
            this.renderEstilos();
        },

        renderEstilos() {
            this.nivel = 'estilos';
            document.getElementById('btn-voltar').style.display = 'none';
            document.getElementById('welcome-screen').style.display = 'block';
            document.getElementById('player').style.display = 'none';
            
            const nav = document.getElementById('nav-content');
            nav.innerHTML = '';
            
            Object.keys(this.dados).forEach(estilo => {
                const div = document.createElement('div');
                div.className = 'nav-item';
                div.innerText = estilo;
                div.onclick = () => this.renderBandas(estilo);
                nav.appendChild(div);
            });
        },

        renderBandas(estilo) {
            this.nivel = 'bandas';
            this.estiloAtual = estilo;
            document.getElementById('btn-voltar').style.display = 'block';
            
            const nav = document.getElementById('nav-content');
            nav.innerHTML = `<h3 style='color:var(--neon-pink)'>${estilo}</h3>`;
            
            Object.keys(this.dados[estilo]).forEach(banda => {
                const div = document.createElement('div');
                div.className = 'nav-item';
                div.innerText = banda;
                div.onclick = () => this.renderMusicas(banda);
                nav.appendChild(div);
            });
        },

        renderMusicas(banda) {
            this.nivel = 'musicas';
            const nav = document.getElementById('nav-content');
            nav.innerHTML = `<h3 style='color:var(--neon-pink)'>${banda}</h3>`;
            
            const musicas = this.dados[this.estiloAtual][banda];
            musicas.forEach(m => {
                const div = document.createElement('div');
                div.className = 'nav-item';
                div.innerText = m.titulo;
                div.onclick = () => this.abrirPlayer(m);
                nav.appendChild(div);
            });
        },

        abrirPlayer(musica) {
            document.getElementById('welcome-screen').style.display = 'none';
            const player = document.getElementById('player');
            player.style.display = 'block';
            
            document.getElementById('musica-titulo').innerText = musica.titulo;
            
            // PDF Integrado (Google Drive Viewer)
            document.getElementById('pdf-viewer').src = `https://docs.google.com/viewer?srcid=${musica.letra}&pid=explorer&efp=true&a=v&chrome=false&embedded=true`;
            
            // Áudios
            document.getElementById('audio-main').src = DRIVE_BASE + musica.musica;
            document.getElementById('audio-bt').src = DRIVE_BASE + musica.bt;
        },

        voltar() {
            if (this.nivel === 'musicas') this.renderBandas(this.estiloAtual);
            else if (this.nivel === 'bandas') this.renderEstilos();
        }
    };

    app.init();
</script>
</body>
</html>
